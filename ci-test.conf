# elspi image -- CI TEST-build configuration (workflow_dispatch only).
#
# ci.conf plus ONE difference: xz -1 instead of xz -9. Sourced, not copied, so
# nothing else can drift. .github/workflows/image.yml picks this file for a
# workflow_dispatch build; a pushed v-tag (a release, which people download)
# still builds with ci.conf at xz -9.
#
# WHY (2026-09-26). On the native arm64 runner, xz -9 of the 5.5 GB image is
# the single biggest step of the build: 8 min 15 s of a 14 min run (c2f1902),
# 10 min 52 s of 15 min before the toolchain trim (fb1c017). A test image is
# downloaded once, by Evan, onto one card. Measured on a 2 GiB slice of the
# real image, 4 threads: -1 took 33 s and made 431 MiB, -9 took 147 s and made
# 279 MiB. So about 4.5x faster for about 1.5x the download.
#
# Path resolution is ci.conf's, for the same reason (see its header): inside
# the container BASE_DIR=/pi-gen and this file is bind-mounted alone at
# /config, so BASH_SOURCE cannot find a sibling; on the host there is no
# BASE_DIR and only this file's own directory is known.

# shellcheck source=ci.conf
_elspi_ci_base="${BASE_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
if [ ! -f "${_elspi_ci_base}/ci.conf" ]; then
	echo "FATAL: ci-test.conf cannot find ci.conf at ${_elspi_ci_base}"
	exit 1
fi
source "${_elspi_ci_base}/ci.conf"
unset _elspi_ci_base

COMPRESSION_LEVEL=1
