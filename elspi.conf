# elspi image -- build configuration (manual builds: a Linux host, or WSL)
#
# Usage -- prefer the wrapper, which handles the host-side traps for you:
#
#   ./build-elspi.sh
#
# `./build-docker.sh -c elspi.conf` also works. The build takes NO key and no
# credential of any kind: the image is keyless (see the SSH block below).
#
# This file is SOURCED BY build.sh as plain shell. It is a NEW file: docs/design/fork.md's
# merge-surface rule says stage selection and configuration live here, never in
# build.sh or under stage0-stage5.

IMG_NAME="elspi"
RELEASE="trixie"
TARGET_HOSTNAME="elspi"

# stage0-2 are pi-gen Lite. stage3-5 are the desktop; this is an appliance.
STAGE_LIST="stage0 stage1 stage2 stage-elspi"

# Export ONE image, ours -- not stage2's Lite image as well.
#
# SKIP_IMAGES is upstream's own mechanism (build.sh:96) and upstream's
# .gitignore already lists it, i.e. it is meant to be a LOCAL build-time
# marker, not a committed file. Creating it here rather than committing it
# keeps docs/design/fork.md's "upstream files edited: none" true and keeps the merge
# surface at zero.
#
# THIS FILE IS SOURCED TWICE, in two different contexts, and the guard below
# is why. build.sh sources it at line 169 with BASE_DIR already set (line 147)
# -- that is the run that matters, inside the container. But build-docker.sh
# ALSO sources it on the host at its line 52, under `set -eu`, with no BASE_DIR
# defined at all. Without the guard that host-side source aborts the build
# before Docker is even invoked, with "BASE_DIR: unbound variable".
if [ -n "${BASE_DIR:-}" ]; then
	touch "${BASE_DIR}/stage2/SKIP_IMAGES"
	# Gate rather than assume: without this marker stage2 exports a second,
	# useless Lite image and roughly doubles the export time.
	if [ ! -f "${BASE_DIR}/stage2/SKIP_IMAGES" ]; then
		echo "FATAL: could not create ${BASE_DIR}/stage2/SKIP_IMAGES"
		exit 1
	fi
fi

# --- Identity ---------------------------------------------------------------
FIRST_USER_NAME="default"

# NO CREDENTIAL ENTERS THIS REPO. docs/design/seam.md call 2, RATIFIED 2026-08-22 -- the
# repo is intended to go public and git history keeps what you commit.
#
# But build.sh:291 hard-exits if DISABLE_FIRST_BOOT_USER_RENAME=1 and
# FIRST_USER_PASS is empty, and we must disable the rename: it arranges the
# Raspberry Pi first-boot user wizard, which on a headless touchscreen
# appliance means the machine comes up asking a question nobody can answer.
#
# So a RANDOM THROWAWAY satisfies the guard, and stage-elspi/05-service-user
# revokes it by overwriting the whole password field with a bare '!'
# (`usermod -p '!'`), so not even its hash ships. It is generated per build,
# never written down, and unusable in the shipped image. The real password is the one typed into
# Imager's customisation page (applied on the machine by
# stage-elspi/12-first-boot-seed), or set later by the interactive provision
# phase.
#
# (Generated without an early-exiting consumer in the pipeline -- `head -c N`
# then od/tr both read to EOF -- so this cannot trip SIGPIPE under pipefail.)
_elspi_rand="$(head -c 64 /dev/urandom | od -An -tx1 | tr -d ' \n')"
FIRST_USER_PASS="${_elspi_rand:0:32}"
unset _elspi_rand

DISABLE_FIRST_BOOT_USER_RENAME=1

# --- SSH: enabled, KEYLESS, and the auth policy is Imager's, per card ------
# SSH is the recovery path -- the touchscreen is exactly what is in question
# when the UI fails to start -- so sshd is ENABLED in every image.
#
# NO KEY IS EVER BAKED IN (decided 2026-09-23). This repo and its release
# images are public; nobody's personal key belongs in one. The operator's
# credentials arrive at FLASH time, from Raspberry Pi Imager's customisation
# page: a password, one or more public keys, or both. cloud-init consumes
# them and stage-elspi/12-first-boot-seed's unit installs the password and
# the keys on the machine (the account ships locked, below). With NEITHER, a
# card is reachable only from the touchscreen, and that unit says so loudly.
#
# NOR DOES THE IMAGE SET AN SSH AUTHENTICATION POLICY. PUBKEY_ONLY_SSH=0
# leaves RPi OS's sshd default (password authentication allowed) in place;
# Imager's "public-key only" choice then turns it off for that card, via
# cloud-init's sshd_config.d/50-cloud-init.conf. PUBKEY_ONLY_SSH=1 would
# write PasswordAuthentication no into sshd_config and make an Imager
# password useless over SSH -- and upstream build.sh refuses it without a
# key anyway.
#
# PUBKEY_SSH_FIRST_USER is set EMPTY, explicitly, so that a value arriving
# from the environment or another config cannot bake a key in after all.
# stage-elspi/12-first-boot-seed/00-run.sh FATALs on any authorized_keys in
# the rootfs, and on any SSH auth option the image sets.
ENABLE_SSH=1
PUBKEY_ONLY_SSH=0
PUBKEY_SSH_FIRST_USER=""

# ELSPI_PUBKEY was the knob that baked a key in until 2026-09-23. Say that it
# is ignored rather than let an old habit look like it worked.
if [ -n "${ELSPI_PUBKEY:-}" ]; then
	echo "NOTE: ELSPI_PUBKEY is set and IGNORED -- the elspi image is keyless."
	echo "      Put your key on Raspberry Pi Imager's customisation page at flash time."
fi

# --- The application baked into the image (seam.md amendment 2026-09-21) ----
# RATIFIED: the image ships the app pinned to the LATEST FULL RELEASE -- never
# a development rc.*, never a branch tip. stage-elspi/10a-app-checkout does the
# selection and the clone; these are its parameters.
#
# REFLEX_SOURCE IS A PARAMETER AND NOT A CONSTANT, which is the whole point:
# with a URL hardcoded in the stage, the build could not be reproduced from a
# local mirror on a machine with no network, and recovery is exactly the case
# this repo exists for. The default below is the public repo so a clean CI
# runner works out of the box; override it to build from a mirror:
#
#   REFLEX_SOURCE=/mnt/git/reflex.git ./build-elspi.sh
#
# The stage itself has NO default and FATALs when this is empty.
REFLEX_SOURCE="${REFLEX_SOURCE:-https://github.com/Funkenjaeger/reflex.git}"

# Optional pin. Leave EMPTY to bake the newest full release in REFLEX_SOURCE.
# A value is still checked: a pinned pre-release is refused BY NAME rather
# than quietly accepted, because "I pinned it deliberately" and "I pasted the
# tag I happened to be looking at" produce the same string.
REFLEX_RELEASE="${REFLEX_RELEASE:-}"

# The remote the SHIPPED image carries -- a different question from where the
# build read. Anonymous HTTPS, matching ui/reflex/utils/updater.py's own
# GITHUB_FETCH_URL; the build source is never shipped as origin, and the stage
# gates on that.
REFLEX_ORIGIN_URL="${REFLEX_ORIGIN_URL:-https://github.com/Funkenjaeger/reflex.git}"

# --- Locale, keyboard, time -------------------------------------------------
# TIMEZONE fixes the standing -0500 bug AT THE SOURCE rather than on the
# running machine. (The live machine was corrected 2026-08-24; this is so a
# rebuild does not reintroduce it.)
LOCALE_DEFAULT="en_US.UTF-8"
KEYBOARD_KEYMAP="us"
KEYBOARD_LAYOUT="English (US)"
TIMEZONE_DEFAULT="America/New_York"

# --- Output -----------------------------------------------------------------
DEPLOY_COMPRESSION="xz"
COMPRESSION_LEVEL=6
