# DRM mode: logind-seat
#
# Option 1 from RUNTIME-INVENTORY.md. The system unit is DISABLED in this mode
# -- the application is started by the user manager of the autologin session on
# tty1, so that it runs as seat0's active session and logind will hand it the
# DRM device.
#
# This fragment exists so that `systemctl cat reflex-ui` still explains what
# happened when someone finds the system unit inert. The real work is done by
# elspi-drm-mode: it enables the tty1 autologin drop-in and installs the user
# unit, and it masks this system unit so the two cannot race for the display.

[Unit]
Description=reflex-ui (INERT -- DRM mode is logind-seat)
ConditionPathExists=!/etc/elspi/drm-mode.logind-seat

[Service]
User=default
Group=default
