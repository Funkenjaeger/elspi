# Autologin on tty1, so systemd-logind creates a session on seat0.
#
# Installed by `elspi-drm-mode logind-seat`, removed by every other mode.
#
# The service account's password is LOCKED (SEAM.md call 2). That does not
# block this: agetty --autologin execs `login -f`, which bypasses
# authentication entirely. A locked password only blocks sudo and ssh-password,
# both of which the interactive provision phase resolves.

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin default --noclear %I $TERM
