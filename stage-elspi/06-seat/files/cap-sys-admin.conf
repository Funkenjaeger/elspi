# DRM mode: cap-sys-admin  (last resort)
#
# Satisfies drm_master_check_perm() directly, so it works regardless of who
# else opened the device first and regardless of seats.
#
# This is close to root and gives back much of what the non-root decision was
# for. It exists so the flash session ALWAYS has a way to leave the lathe
# working, not as a preference. If the machine ends up here, that is a finding
# worth writing down, not a resting place.

[Service]
User=default
Group=default
AmbientCapabilities=CAP_SYS_ADMIN
CapabilityBoundingSet=CAP_SYS_ADMIN

[Unit]
After=plymouth-quit-wait.service
