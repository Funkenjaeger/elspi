# DRM mode: first-opener  (image default)
#
# A plain system unit as the service user. No seat, no session, no capability.
# Relies on the DRM core granting master to the first opener of a device that
# has no master -- so the ONLY thing that must be true is that nothing else
# holds master by the time this starts.
#
# Plymouth's DRM renderer IS such a master. Ordering after plymouth-quit-wait
# is therefore load-bearing, not cosmetic.

[Service]
User=default
Group=default

[Unit]
After=plymouth-quit-wait.service
