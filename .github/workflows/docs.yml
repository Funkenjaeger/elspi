name: docs

# The published site. Builds on every push and PR so a broken internal link
# fails here rather than on the site; deploys to GitHub Pages from arm64.
#
# Mirrors the pattern the reflex repo uses (.github/workflows/docs.yml there):
# a build job that always runs and uploads the artifact only on the publishing
# branch, and a separate deploy job with the pages/id-token permissions and
# the github-pages environment. Two jobs rather than one because
# actions/deploy-pages needs write permissions that the build must not have.
#
# Pages is enabled on this repository (Settings -> Pages -> Source: GitHub
# Actions) and the github-pages environment's deployment branch policy
# includes arm64 (decision D6).
#
# Publishes from arm64, unlike reflex, which publishes from integration.
# elspi has no branch ladder: arm64 is the main line (master is a frozen
# legacy armhf line that does not publish), and the recovery instructions on
# the site should describe the image the tags were cut from.
on:
  push:
    branches: [arm64]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Pinned to the version the site is built with locally. Same pin as
      # tier1.yml's docs step, and as reflex's.
      - name: Install MkDocs
        run: pip install "mkdocs-material==9.7.7"

      # --strict so a dangling internal link is a red build, not a 404 for a
      # reader standing at a lathe.
      - name: Build
        run: mkdocs build --strict

      # mkdocs.yml sets site_dir: deploy/site, so the output lands under the
      # directory upstream pi-gen's .gitignore already ignores. Keep this path
      # and site_dir in step.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/arm64'
        with:
          path: deploy/site

  deploy:
    if: github.ref == 'refs/heads/arm64'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
