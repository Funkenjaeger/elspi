# elspi image -- CI build configuration.
#
# Identical to elspi.conf except where CI genuinely differs. Sourced, not
# copied, so the two cannot drift: a setting fixed in one place is fixed in
# both.
#
# Resolving the path to elspi.conf is fiddlier than it looks, because this file
# is sourced in TWO places with different filesystem layouts:
#
#   - by build.sh INSIDE the container, where BASE_DIR=/pi-gen and the whole
#     repo was COPYed in, so ${BASE_DIR}/elspi.conf exists;
#   - by build-docker.sh ON THE HOST (its line 52), under `set -eu`, with no
#     BASE_DIR at all -- there only this file's own directory is known.
#
# Note the container case cannot use BASH_SOURCE: build-docker.sh bind-mounts
# just the chosen config at /config, so BASH_SOURCE would be "/config" and the
# sibling lookup would resolve to /elspi.conf, which does not exist.

# shellcheck source=elspi.conf
_elspi_base="${BASE_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
if [ ! -f "${_elspi_base}/elspi.conf" ]; then
	echo "FATAL: ci.conf cannot find elspi.conf at ${_elspi_base}"
	exit 1
fi
source "${_elspi_base}/elspi.conf"
unset _elspi_base

# CI itself never builds at this level: ci-test.conf sources this file and
# then overrides COMPRESSION_LEVEL to 1 for every actual dispatch build, and
# a release is one of those dispatch builds promoted byte-for-byte, also
# xz -1 (see ci-test.conf's header and docs/flashing.md, "Releasing a tested
# build"). -9 remains here for a build run with `-c ci.conf` directly,
# bypassing ci-test.conf's speed override -- e.g. to produce the CI profile's
# image at full compression outside the dispatch/promote flow -- and it is
# the value tests/test-base-reuse.sh checks to prove that ci-test.conf's
# override doesn't leak back into ci.conf's own setting.
DEPLOY_COMPRESSION="xz"
COMPRESSION_LEVEL=9

# NO KEY, HERE OR ANYWHERE (2026-09-23). A CI image is exactly the image a
# release publishes, so it is built keyless like every other: elspi.conf sets
# PUBKEY_SSH_FIRST_USER empty and PUBKEY_ONLY_SSH=0, and nothing in this file
# may change either. The operator's SSH key and/or password are typed into
# Raspberry Pi Imager's customisation page at flash time.
