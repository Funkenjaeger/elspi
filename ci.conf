# elspi image -- CI build configuration.
#
# Identical to elspi.conf except where CI genuinely differs. Sourced, not
# copied, so the two cannot drift: a setting fixed in one place is fixed in
# both.
#
# Resolving the path to elspi.conf is fiddlier than it looks, because this file
# is sourced in TWO places with different filesystem layouts:
#
#   - by build.sh INSIDE the container, where BASE_DIR=/pi-gen and the whole
#     repo was COPYed in, so ${BASE_DIR}/elspi.conf exists;
#   - by build-docker.sh ON THE HOST (its line 52), under `set -eu`, with no
#     BASE_DIR at all -- there only this file's own directory is known.
#
# Note the container case cannot use BASH_SOURCE: build-docker.sh bind-mounts
# just the chosen config at /config, so BASH_SOURCE would be "/config" and the
# sibling lookup would resolve to /elspi.conf, which does not exist.

# shellcheck source=elspi.conf
_elspi_base="${BASE_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
if [ ! -f "${_elspi_base}/elspi.conf" ]; then
	echo "FATAL: ci.conf cannot find elspi.conf at ${_elspi_base}"
	exit 1
fi
source "${_elspi_base}/elspi.conf"
unset _elspi_base

# CI publishes the artifact, so compress harder -- the build minutes are
# already spent and the download is the part a human waits on.
DEPLOY_COMPRESSION="xz"
COMPRESSION_LEVEL=9

# In CI there is no human to hand a key to. The workflow supplies ELSPI_PUBKEY
# from a repository variable (a PUBLIC key -- not a secret, and deliberately
# not a repository secret, so that what is baked in is auditable).
#
# A CI image is a BUILD ARTIFACT, not something to flash blind: the pubkey it
# carries is whatever CI was configured with, which is why the manifest records
# that DRM has not been verified on hardware.
